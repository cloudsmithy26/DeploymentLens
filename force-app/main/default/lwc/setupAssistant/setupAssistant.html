<template>
    <lightning-card title="DeploymentLens — Setup Assistant" icon-name="standard:setup_assistant_step">
        <div class="slds-var-p-horizontal_medium slds-var-p-bottom_medium">
            <p class="slds-var-m-bottom_medium slds-text-color_weak">
                The External Credential and Named Credential are installed with the package.
                Complete these three steps once per org, then test the connection.
            </p>

            <template lwc:if={info}>
                <div class="slds-text-heading_small slds-var-m-bottom_x-small">Step 1 — Create an External Client App</div>
                <ol class="slds-list_ordered slds-var-m-bottom_small">
                    <li>Setup → <b>External Client App Manager</b> → New.</li>
                    <li>External Client App Name: <b>DeploymentLens</b>. Contact Email: your email.</li>
                    <li>Expand <b>API (Enable OAuth Settings)</b> and check <b>Enable OAuth</b>.</li>
                    <li>Callback URL — paste (required field, unused by this flow):</li>
                </ol>
                <div class="slds-box slds-box_x-small slds-var-m-vertical_x-small value-row">
                    <code>{info.callbackUrl}</code>
                    <lightning-button-icon icon-name="utility:copy_to_clipboard" alternative-text="Copy"
                        data-value={info.callbackUrl} onclick={handleCopy}></lightning-button-icon>
                </div>
                <ol class="slds-list_ordered slds-var-m-bottom_small" start="5">
                    <li>OAuth Scopes → add <b>Manage user data via APIs (api)</b>.</li>
                    <li>Flow Enablement → check <b>Client Credentials Flow</b>. Keep everything else default. Click <b>Create</b>.</li>
                    <li>Open the app's <b>Policies</b> tab → Edit → OAuth Flows and External Client App Enhancements → check <b>Enable Client Credentials Flow</b> and set <b>Run As</b> to an admin user. Save.</li>
                    <li>Back on Settings, open <b>Consumer Key and Secret</b> and copy both values. Wait 5–10 minutes before step 4 — new apps propagate slowly.</li>
                </ol>

                <div class="slds-text-heading_small slds-var-m-top_medium slds-var-m-bottom_x-small">Step 2 — Point the External Credential at this org</div>
                <p>Setup → Named Credentials → <b>External Credentials</b> tab →
                <b>DeploymentLens Self EC</b> → Edit. Set the token endpoint to:</p>
                <div class="slds-box slds-box_x-small slds-var-m-vertical_x-small value-row">
                    <code>{info.tokenEndpoint}</code>
                    <lightning-button-icon icon-name="utility:copy_to_clipboard" alternative-text="Copy"
                        data-value={info.tokenEndpoint} onclick={handleCopy}></lightning-button-icon>
                </div>
                <p>Then edit the <b>Admin</b> principal and paste the consumer key (Client Id)
                and consumer secret (Client Secret) from step 1.</p>

                <div class="slds-text-heading_small slds-var-m-top_medium slds-var-m-bottom_x-small">Step 3 — Point the Named Credential at this org</div>
                <p>Setup → Named Credentials → <b>DeploymentLens Self</b> → Edit. Set URL to:</p>
                <div class="slds-box slds-box_x-small slds-var-m-vertical_x-small value-row">
                    <code>{info.orgUrl}</code>
                    <lightning-button-icon icon-name="utility:copy_to_clipboard" alternative-text="Copy"
                        data-value={info.orgUrl} onclick={handleCopy}></lightning-button-icon>
                </div>
            </template>

            <div class="slds-var-m-top_medium">
                <lightning-button variant="brand" label="Test connection" onclick={handleTest}
                    disabled={testing}></lightning-button>
            </div>

            <template lwc:if={testResult}>
                <div class={resultBoxClass}>
                    <p><b>{testResult.status}</b> — {testResult.detail}</p>
                    <p class="slds-var-m-top_xx-small">{testResult.hint}</p>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
