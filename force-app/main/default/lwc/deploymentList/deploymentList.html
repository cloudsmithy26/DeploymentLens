<template>
    <template lwc:if={isLoading}>
        <lightning-spinner alternative-text="Loading deployments" size="medium"></lightning-spinner>
    </template>
    <template lwc:if={error}>
        <div class="slds-text-color_error slds-var-p-around_small">{error}</div>
    </template>
    <template lwc:if={hasRows}>
        <lightning-datatable
            key-field="id"
            data={rows}
            columns={columns}
            hide-checkbox-column
            onrowaction={handleRowAction}>
        </lightning-datatable>
    </template>
    <template lwc:if={showEmpty}>
        <div class="slds-var-p-around_small slds-text-color_weak">No deployments found.</div>
    </template>
</template>
